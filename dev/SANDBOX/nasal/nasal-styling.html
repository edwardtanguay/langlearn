<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>French Nasal Styling – Ticket Reference</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       TICKET REFERENCE: PHONETIC NASAL STYLING
       ========================================================================== */
    :root {
      /* Background */
      --bg-dark: #1e1b18;
      --bg-card: #27231e;
      --border-card: rgba(255, 255, 255, 0.08);

      /* Colors */
      --text-yellow: #facc15;
      --text-white: #ffffff;
      --text-muted: #a8a29e;

      /* Typography */
      --font-mono: 'Courier Prime', Courier, monospace;
      --font-ui: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    /* Minimal reference card */
    .nasal-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      max-width: 520px;
      width: 100%;
    }

    .french-text {
      font-family: var(--font-ui);
      font-size: 16px;
      font-weight: 700;
      color: var(--text-white);
    }

    /* Base phonetic respelling in yellow typewriter font */
    .phonetic-respelling {
      font-family: var(--font-mono);
      font-size: 26px;
      font-weight: 400;
      color: var(--text-yellow);
      letter-spacing: 0.02em;
      line-height: 1.3;
    }

    /* Glowing upright white nasal letters */
    .nasal {
      color: #ffffff !important;
      font-style: normal !important;   /* Upright / Non-italic */
      font-weight: 700 !important;     /* Bold for high luminance */
      text-shadow: 0 0 7px rgba(255, 255, 255, 0.9),
                   0 0 16px rgba(254, 240, 138, 0.55);
      letter-spacing: 0.02em;
      padding: 0 1px;
    }
  </style>
</head>
<body>

  <!-- Component Card Reference -->
  <div class="nasal-card">
    <div class="french-text">un bon vin blanc</div>
    <div class="phonetic-respelling">
      <span class="nasal">un</span>-b<span class="nasal">on</span>-v<span class="nasal">in</span>-bl<span class="nasal">an</span>
    </div>
  </div>

</body>
</html>
